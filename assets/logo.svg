<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="100%" stop-color="#121e30"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>
    <linearGradient id="rhythmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Human Rhythm Typing Wave Pulse -->
  <path d="M 80 250 L 140 250 L 160 210 L 180 290 L 200 230 L 220 270 L 240 250 L 420 250" fill="none" stroke="url(#rhythmGrad)" stroke-width="3" stroke-dasharray="6 8" stroke-opacity="0.5"/>

  <!-- Isometric Mechanical Keyboard Keycap -->
  <!-- Keycap Base Skirt -->
  <polygon points="170,290 330,290 390,390 110,390" fill="#14213d" stroke="#00bbf9" stroke-width="3"/>
  <!-- Keycap Top Surface -->
  <polygon points="190,170 310,170 340,270 160,270" fill="#1b2a4a" stroke="url(#keyGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Keycap Inscription / Legend ('T') -->
  <path d="M 220 205 L 280 205 M 250 205 L 250 245" stroke="#00f5d4" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Typing Rhythm Fluctuations / Dynamic Dots -->
  <circle cx="160" cy="210" r="6" fill="#ff007f" filter="url(#glow)"/>
  <circle cx="180" cy="290" r="6" fill="#7928ca" filter="url(#glow)"/>
  <circle cx="200" cy="230" r="5" fill="#ff007f"/>
  <circle cx="220" cy="270" r="5" fill="#00f5d4"/>

  <!-- Cursor Blink Bar -->
  <line x1="330" y1="210" x2="330" y2="245" stroke="#ffffff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
</svg>
